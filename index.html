<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>课程学习进度</title>
<style>
:root{--bg:#f3f5f8;--surface:#fff;--ink:#1c2430;--mute:#69747f;--line:#d8dee5;--lec:#2455c3;--hw:#1f8a6a;--warn:#b3402a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--surface:#171e27;--ink:#e6ebf1;--mute:#93a0ad;--line:#2a3441;--lec:#6f97f0;--hw:#4cc29d;--warn:#f0907a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151c;--surface:#171e27;--ink:#e6ebf1;--mute:#93a0ad;--line:#2a3441;--lec:#6f97f0;--hw:#4cc29d;--warn:#f0907a;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 12px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:880px;margin:0 auto;padding:16px 16px 56px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:1px solid var(--line);border-radius:6px;padding:3px 10px}
button{transition:border-color .15s,background .15s}
button:hover{border-color:var(--mute);background:var(--surface)}
:focus-visible{outline:2px solid var(--lec);outline-offset:2px}
input[type=text],input:not([type]),textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px;width:100%}
.bar{display:flex;gap:8px;align-items:center;margin:4px 0 10px}
.tabs{flex:1;min-width:0;position:relative;display:flex;gap:6px;overflow-x:auto;padding:2px 22px 2px 2px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 22px),transparent)}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;border-radius:999px;padding:4px 14px;position:relative;overflow:hidden}
.tab i{position:absolute;left:0;bottom:0;height:3px;background:var(--hw);opacity:.85}
.tab.on,.plus.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.plus{flex:none;width:32px;height:32px;padding:0;border-radius:50%;font-size:20px;line-height:1}
.addc{display:flex;gap:6px;margin:0 0 12px}
.head{display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap;margin:18px 0 2px}
.head h1{margin:0}
.mv{display:flex;gap:4px}
.mv button{font-size:13px;padding:3px 12px;background:var(--surface)}
.mv button:disabled{opacity:.4;cursor:default}
.grp{display:flex;flex-wrap:wrap;align-items:center;gap:2px 18px;margin:8px 0 6px}
.gtab{border:0;border-bottom:2px solid transparent;border-radius:0;padding:2px 0;color:var(--mute);background:none}
.gtab:hover{background:none}
.gtab small{opacity:.7;margin-left:2px}
.gtab.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.gt{display:flex;gap:4px;margin-left:auto}
.gt button{font-size:12px;color:var(--mute);padding:1px 8px}
.gt button:disabled{opacity:.4;cursor:default}
.gs{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}
.gs select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 6px;color:var(--ink)}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:0 0 10px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--lec),var(--hw))}
h1{font:600 2rem/1.25 "Songti SC","Noto Serif SC","Source Han Serif SC",serif;margin:22px 0 2px;outline:none}
.sum{margin:0 0 8px;color:var(--mute)}
.nxt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px;font-size:14px}
.nxt b{font-weight:600;color:var(--lec)}
.nxt button{font-size:12px;padding:1px 10px;color:var(--mute)}
.strip{display:flex;flex-wrap:wrap;gap:5px}
.cell{display:flex;flex-direction:column;gap:2px;padding:0;border:0;width:26px}
.cell i{display:block;height:14px;border-radius:3px;background:var(--line)}
.cell i:first-child.f{background:var(--lec)}
.cell i:last-child.f{background:var(--hw)}
.legend{margin:8px 0 26px;font-size:13px;color:var(--mute)}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin:0 4px 0 10px}
.row{display:grid;grid-template-columns:2rem 1fr 1fr auto;gap:0 14px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.row.hd{border-top:0;padding:0 0 6px;color:var(--mute);font-size:13px}
.no{font:600 1.2rem/1.4 "Songti SC","Noto Serif SC",serif;color:var(--mute)}
.row.ok .no{color:var(--hw)}
.row.next .no{color:var(--lec)}
.row.flash{animation:fl 1.4s ease-out}
@keyframes fl{0%,30%{background:var(--surface)}100%{background:transparent}}
.col+.col{border-left:1px solid var(--line);padding-left:14px}
.it{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.it input{appearance:none;-webkit-appearance:none;flex:none;display:grid;place-content:center;width:18px;height:18px;margin:4px 0 0;border:1.5px solid var(--mute);border-radius:5px;background:var(--surface);cursor:pointer}
.it input::after{content:"";width:9px;height:5px;border:2px solid var(--bg);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.it input:checked::after{opacity:1}
.it.lec input:checked{background:var(--lec);border-color:var(--lec)}
.it.hw input:checked{background:var(--hw);border-color:var(--hw)}
.it.done .tx{color:var(--mute);text-decoration:line-through}
.it.nx .tx{font-weight:600}
.dt{flex:none;font-size:12px;color:var(--mute);margin-top:2px}
.col a{color:var(--lec);text-decoration:none;font-size:13px;margin-left:24px}
.tools{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.tools button{font-size:12px;padding:1px 8px;color:var(--mute)}
.tools button:disabled{opacity:.4;cursor:default}
.tools .arm{color:var(--warn);border-color:var(--warn)}
.ed{display:grid;gap:6px}
.note{grid-column:2/-1;margin-top:10px;min-height:88px;resize:vertical}
.empty{padding:26px 0;color:var(--mute);border-top:1px solid var(--line)}
.addu{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;border-top:1px solid var(--line);padding-top:16px}
.bulk{margin-top:10px;font-size:14px}
.bulk summary,details summary{cursor:pointer}
.bulk p{margin:6px 0 0;font-size:13px}
.bulk textarea{margin:8px 0;min-height:110px}
.foot{margin-top:28px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
details{width:100%;color:var(--mute)}
.foot details textarea{margin:8px 0;min-height:120px;font:12px/1.4 ui-monospace,Menlo,monospace}
.bkr{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.fl{border:1px solid var(--line);border-radius:6px;padding:3px 10px;cursor:pointer;color:var(--ink)}
.fl:hover{border-color:var(--mute);background:var(--surface)}
.stale{color:var(--warn)}
.msg{color:var(--warn);margin-left:8px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 16px}
.st{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-width:100px}
.st b{display:block;font:600 1.5rem/1.3 "Songti SC","Noto Serif SC",serif}
.st span{font-size:12px;color:var(--mute)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);grid-auto-columns:11px;gap:3px;margin:4px 0 4px}
.heat i{border-radius:2px;background:var(--line)}
.heat .l1{background:var(--hw);opacity:.4}
.heat .l2{background:var(--hw);opacity:.7}
.heat .l3{background:var(--hw)}
.cap{font-size:12px;color:var(--mute);margin:0 0 6px}
.ov h2{font-size:13px;font-weight:600;color:var(--mute);letter-spacing:.04em;margin:24px 0 2px}
.oc{display:grid;grid-template-columns:minmax(0,1fr) 140px 3.2em;gap:2px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.oc .nm{border:0;padding:0;background:none;text-align:left;font-weight:600;font-size:16px}
.oc .nm:hover{color:var(--lec)}
.ob{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.ob i{display:block;height:100%;background:linear-gradient(90deg,var(--lec),var(--hw))}
.op{font-size:13px;color:var(--mute);text-align:right}
.onx{grid-column:1/-1;font-size:13px;color:var(--mute)}
.lnk{border:0;padding:0;background:none;color:var(--lec);text-align:left}
.lnk:hover{background:none;text-decoration:underline}
@media (max-width:640px){
 .row{grid-template-columns:1.6rem 1fr}
 .row.hd{display:none}
 .col+.col{border-left:0;padding-left:0;margin-top:6px}
 .tools{grid-column:2;justify-content:flex-start;margin-top:8px}
 .note{grid-column:2}
 .addu{grid-template-columns:1fr}
 .oc{grid-template-columns:minmax(0,1fr) 80px 3em}
}
</style>
</head>
<body>
<main id="app"></main>
<script>
var K='study-system-v1';
function mk(l,h,n){return{lec:l,lecUrl:'',hw:h,hwUrl:'',ld:0,hd:0,note:n||''}}
var SEED=[
mk('函数与控制流','lab00、lab01、hw01'),
mk('高阶函数、Lambda、环境图','lab02、hw02'),
mk('递归、Python 列表','lab03；Project Hog'),
mk('树递归、数据抽象','lab04、hw03'),
mk('序列与树','hw04'),
mk('迭代器、可变性','lab05；Project Cats'),
mk('生成器','hw05'),
mk('面向对象','lab06'),
mk('链表、继承','lab07、hw06'),
mk('可变树','lab08；Project Ants'),
mk('Scheme、Scheme 列表','lab09、hw07、hw08'),
mk('解释器、程序即数据与宏','lab10、lab11、hw09；Project Scheme'),
mk('SQL','lab12、hw10、hw11')];
var S=null;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!Array.isArray(S.courses)||!S.courses.length){S={active:0,courses:[{name:'CS61A',units:SEED}]}}
S.groups=Array.isArray(S.groups)?S.groups:[];S.courses.forEach(function(x){x.g=typeof x.g==='string'?x.g:''});
if(!S.gm){S.gm=1;if(!S.courses.some(function(x){return x.g})){
 var GM={'数学分析':'数理基础课','概率论与数理统计':'数理基础课','离散':'数理基础课','离散数学':'数理基础课','复分析':'数理基础课','数据结构':'计算机专业课','数据库':'计算机专业课','C/C++':'计算机专业课','CET-6':'英语','大雾':'大雾','CMC':'CMC'};
 S.courses.forEach(function(x){x.g=GM[x.name]||''});S.groups=['数理基础课','计算机专业课','英语','大雾','CMC'];save()}}
S.ov=!!S.ov;
var openNote={},editing=-1,armed='',msg='',addingC=false,focusAdd=false,goTo=-1,openD={};

function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function url(s){s=String(s||'').trim();return /^https?:\/\//i.test(s)?s:''}
function cur(){return S.courses[Math.max(0,Math.min(S.active,S.courses.length-1))]}
function pc(x){var t=0,d=0;x.units.forEach(function(u){t+=2;d+=(u.ld?1:0)+(u.hd?1:0)});return t?Math.round(d/t*100):0}
function gs(){var a=S.groups.filter(function(g){return S.courses.some(function(x){return x.g===g})});S.courses.forEach(function(x){if(a.indexOf(x.g)<0)a.push(x.g)});return a}
function mem(g){var r=[];S.courses.forEach(function(x,i){if(x.g===g)r.push(i)});return r}
function p2(n){return (n<10?'0':'')+n}
function dk(t){var d=new Date(t);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function md(t){var d=new Date(t);return (d.getMonth()+1)+'/'+d.getDate()}
// 下一步：第一个没勾的 Lecture 或作业
function nx(x){for(var i=0;i<x.units.length;i++){var u=x.units[i];if(!u.ld)return{i:i,k:'lec',t:u.lec};if(!u.hd)return{i:i,k:'hw',t:u.hw}}return null}
function nxText(N){return '单元 '+(N.i+1)+' · '+(N.k==='lec'?'Lecture':'作业')+'：'+esc(N.t||'（未填写）')}
// 按日期统计勾选数
function acts(){var m={};S.courses.forEach(function(x){x.units.forEach(function(u){
 if(u.ld&&u.lt){var a=dk(u.lt);m[a]=(m[a]||0)+1}
 if(u.hd&&u.ht){var b=dk(u.ht);m[b]=(m[b]||0)+1}})});return m}

function item(u,i,k,isN){
 var lec=k==='lec',d=lec?u.ld:u.hd,t=lec?u.lec:u.hw,l=url(lec?u.lecUrl:u.hwUrl),ts=lec?u.lt:u.ht;
 return '<div class="col"><label class="it '+(lec?'lec':'hw')+(d?' done':'')+(isN?' nx':'')+'"><input type="checkbox" data-a="tg" data-i="'+i+'" data-k="'+(lec?'ld':'hd')+'"'+(d?' checked':'')+'><span class="tx">'+esc(t||'（未填写）')+'</span>'+(d&&ts?'<span class="dt" title="完成于 '+dk(ts)+'">'+md(ts)+'</span>':'')+'</label>'+(l?'<a href="'+esc(l)+'" target="_blank" rel="noopener">打开链接</a>':'')+'</div>';
}
function edit(u,i){
 return '<div class="col ed"><input name="lec" value="'+esc(u.lec)+'" placeholder="Lecture 标题"><input name="lu" value="'+esc(u.lecUrl)+'" placeholder="Lecture 链接（可选）"></div>'+
 '<div class="col ed"><input name="hw" value="'+esc(u.hw)+'" placeholder="作业标题"><input name="hu" value="'+esc(u.hwUrl)+'" placeholder="作业链接（可选）"></div>';
}

function grpBar(){
 var c=cur(),g=c.g,G=gs(),NG=G.filter(Boolean),gi=NG.indexOf(g);
 return '<div class="grp"><button class="gtab'+(S.ov?' on':'')+'" data-a="ov">总览</button>'+
 G.map(function(k,i){return '<button class="gtab'+(!S.ov&&k===g?' on':'')+'" data-a="grp" data-i="'+i+'">'+esc(k||'其他')+' <small>'+mem(k).length+'</small></button>'}).join('')+
 (!S.ov&&g?'<span class="gt"><button data-a="grn">改名</button><button data-a="gml" title="分组前移"'+(gi>0?'':' disabled')+'>‹</button><button data-a="gmr" title="分组后移"'+(gi<NG.length-1?'':' disabled')+'>›</button></span>':'')+'</div>';
}

function overview(){
 var A=acts(),tot=0,dn=0,w7=0,h='',now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate()),d,j;
 S.courses.forEach(function(x){x.units.forEach(function(u){tot+=2;dn+=(u.ld?1:0)+(u.hd?1:0)})});
 for(j=0;j<7;j++){d=new Date(today);d.setDate(d.getDate()-j);w7+=A[dk(d)]||0}
 var sk=0;d=new Date(today);if(!A[dk(d)])d.setDate(d.getDate()-1);while(A[dk(d)]){sk++;d.setDate(d.getDate()-1)}
 h+='<div class="ov"><div class="head"><h1>总览</h1></div>';
 h+='<div class="stats"><div class="st"><b>'+(tot?Math.round(dn/tot*100):0)+'%</b><span>全部课程 '+dn+' / '+tot+' 项</span></div>'+
 '<div class="st"><b>'+w7+'</b><span>最近 7 天完成</span></div>'+
 '<div class="st"><b>'+sk+'</b><span>连续学习天数</span></div></div>';
 var wd=(today.getDay()+6)%7,st=new Date(today);st.setDate(st.getDate()-wd-7*11);
 h+='<div class="heat" role="img" aria-label="最近 12 周每天完成的项数">';
 for(d=new Date(st);d<=today;d.setDate(d.getDate()+1)){var n=A[dk(d)]||0,lv=n>=4?3:n>=2?2:n?1:0;h+='<i class="l'+lv+'" title="'+dk(d)+'：'+n+' 项"></i>'}
 h+='</div><p class="cap">最近 12 周，每一列是一周（周一在上）。勾选日期从这个版本开始记录。</p>';
 gs().forEach(function(g){var m=mem(g);if(!m.length)return;
  h+='<h2>'+esc(g||'其他')+'</h2>';
  m.forEach(function(ci){var x=S.courses[ci],p=pc(x),N=nx(x);
   h+='<div class="oc"><button class="nm" data-a="open" data-i="'+ci+'">'+esc(x.name)+'</button><span class="ob"><i style="width:'+p+'%"></i></span><span class="op">'+p+'%</span>'+
   '<div class="onx">'+(!x.units.length?'还没有单元':N?'下一步：<button class="lnk" data-a="open" data-i="'+ci+'" data-u="'+N.i+'">'+nxText(N)+'</button>':'全部完成 ✓')+'</div></div>';
  });
 });
 return h+'</div>';
}

function course(){
 var c=cur(),U=c.units,n=U.length,done=0,h='';
 U.forEach(function(u){done+=(u.ld?1:0)+(u.hd?1:0)});
 var pct=n?Math.round(done/(2*n)*100):0,N=nx(c);
 var ci=S.courses.indexOf(c),g=c.g,G=gs(),m=mem(g),pi=m.indexOf(ci),O=G.indexOf('')<0?G.concat(['']):G;
 h+='<div class="bar"><nav class="tabs" id="tabs">'+S.courses.map(function(x,i){if(x.g!==g)return '';return '<button class="tab'+(x===c?' on':'')+'" data-a="tab" data-i="'+i+'">'+esc(x.name)+'<i style="width:'+pc(x)+'%"></i></button>'}).join('')+'</nav>'+
 '<button class="plus'+(addingC?' on':'')+'" data-a="addc" aria-label="'+(addingC?'收起添加课程':'添加课程')+'" aria-expanded="'+addingC+'">'+(addingC?'×':'+')+'</button></div>';
 if(addingC)h+='<form class="addc" data-f="course"><input name="n" placeholder="新课程名称" maxlength="30"><button>添加</button></form>';
 h+='<div class="head"><h1 contenteditable="true" spellcheck="false" data-a="title" aria-label="课程名称，点击可修改">'+esc(c.name)+'</h1>'+
 (m.length>1?'<span class="mv"><button data-a="mvl"'+(pi>0?'':' disabled')+'>← 前移</button><button data-a="mvr"'+(pi<m.length-1?'':' disabled')+'>后移 →</button></span>':'')+
 '<label class="gs">分组<select data-a="gsel">'+O.map(function(k){return '<option value="'+esc(k)+'"'+(k===g?' selected':'')+'>'+esc(k||'其他')+'</option>'}).join('')+'<option value="__new">＋ 新建分组…</option></select></label></div>';
 h+='<p class="sum">已完成 '+done+' / '+(2*n)+' 项，共 '+pct+'%</p><div class="prog"><i style="width:'+pct+'%"></i></div>';
 if(n)h+='<div class="nxt">'+(N?'<span>下一步</span><b>'+nxText(N)+'</b><button data-a="go" data-i="'+N.i+'">定位</button>':'<span>这门课全部完成了 ✓</span>')+'</div>';
 if(n){
  h+='<div class="strip">'+U.map(function(u,i){return '<button class="cell" data-a="go" data-i="'+i+'" title="单元 '+(i+1)+'：'+esc(u.lec)+'" aria-label="跳到单元 '+(i+1)+'"><i class="'+(u.ld?'f':'')+'"></i><i class="'+(u.hd?'f':'')+'"></i></button>'}).join('')+'</div>';
 }
 h+='<p class="legend">每一格是一个单元：上半是 Lecture<span class="dot" style="background:var(--lec)"></span>下半是作业<span class="dot" style="background:var(--hw)"></span>填色表示已完成</p>';
 if(n){
  h+='<div class="row hd"><span></span><span><span class="dot" style="background:var(--lec);margin-left:0"></span>Lecture</span><span style="padding-left:14px"><span class="dot" style="background:var(--hw);margin-left:0"></span>作业</span><span></span></div>';
  U.forEach(function(u,i){
   var E=editing===i,isN=N&&N.i===i;
   h+='<section class="row'+(u.ld&&u.hd?' ok':'')+(isN?' next':'')+'" id="u'+i+'"><span class="no">'+(i+1)+'</span>'+(E?edit(u,i):item(u,i,'lec',isN&&N.k==='lec')+item(u,i,'hw',isN&&N.k==='hw'))+
   '<span class="tools">'+(E?'<button data-a="sv" data-i="'+i+'">保存</button><button data-a="cx">取消</button><button data-a="up" data-i="'+i+'" title="上移"'+(i>0?'':' disabled')+'>↑</button><button data-a="dn" data-i="'+i+'" title="下移"'+(i<n-1?'':' disabled')+'>↓</button>':
   '<button data-a="note" data-i="'+i+'">'+(u.note?'笔记 •':'笔记')+'</button><button data-a="ed" data-i="'+i+'">编辑</button><button data-a="del" data-i="'+i+'"'+(armed==='u'+i?' class="arm"':'')+'>'+(armed==='u'+i?'再点一次删除':'删除')+'</button>')+'</span>'+
   (openNote[i]?'<textarea class="note" data-a="nt" data-i="'+i+'" placeholder="记下这个单元的笔记、卡住的地方和待复习的问题">'+esc(u.note)+'</textarea>':'')+'</section>';
  });
 }else{
  h+='<div class="empty">这门课还没有单元。在下面填写第一个 Lecture 和对应的作业，或者用「批量添加」一次粘贴整个章节目录。</div>';
 }
 h+='<form class="addu" data-f="unit"><input name="lec" placeholder="Lecture 标题"><input name="hw" placeholder="对应作业"><button>添加单元</button></form>';
 h+='<details class="bulk" data-d="bulk"'+(openD.bulk?' open':'')+'><summary>批量添加单元</summary><p>每行一个单元，用 | 分开 Lecture 和作业（没有作业可以只写 Lecture）。例如：<br>图的基本概念 | 习题 1.1–1.5<br>树 | 习题 2</p><textarea id="bulk" placeholder="图的基本概念 | 习题 1&#10;树 | 习题 2&#10;平面图 | 习题 3"></textarea><button data-a="bulk">添加这些单元</button></details>';
 return h;
}

function foot(){
 var stale=!S.bk||Date.now()-S.bk>7*864e5;
 return '<div class="foot">'+(!S.ov&&S.courses.length>1?'<button data-a="delc"'+(armed==='c'?' class="arm"':'')+'>'+(armed==='c'?'再点一次删除这门课':'删除这门课')+'</button>':'')+
 '<details data-d="bk"'+(openD.bk||msg?' open':'')+'><summary>备份与恢复'+(stale?' <span class="stale">· '+(S.bk?'已超过 7 天没备份':'还没下载过备份')+'</span>':' · 上次备份 '+md(S.bk))+'</summary>'+
 '<div class="bkr"><button data-a="dl">下载备份文件</button><label class="fl">从文件恢复<input type="file" accept=".json,application/json" data-a="file" hidden></label></div>'+
 '<textarea id="bk" aria-label="备份数据">'+esc(JSON.stringify(S))+'</textarea><button data-a="imp">用上面的内容覆盖当前数据</button><span class="msg">'+esc(msg)+'</span></details></div>';
}

function R(){
 var ot=document.getElementById('tabs'),sl=ot?ot.scrollLeft:0;
 document.getElementById('app').innerHTML=grpBar()+(S.ov?overview():course())+foot();
 var tb=document.getElementById('tabs');
 if(tb){tb.scrollLeft=sl;var ac=tb.querySelector('.on');
  if(ac){var l=ac.offsetLeft,r=l+ac.offsetWidth+22;if(l<tb.scrollLeft)tb.scrollLeft=l-4;else if(r>tb.scrollLeft+tb.clientWidth)tb.scrollLeft=r-tb.clientWidth}}
 if(focusAdd){focusAdd=false;var ni=document.querySelector('.addc input');if(ni)ni.focus()}
 if(goTo>=0){var el=document.getElementById('u'+goTo);goTo=-1;if(el)jump(el,false)}
 msg='';
}
function jump(el,smooth){el.scrollIntoView({behavior:smooth?'smooth':'auto',block:'center'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}

function imp(text){
 try{var d=JSON.parse(text);
  if(!d||!Array.isArray(d.courses)||!d.courses.length)throw 0;
  d.courses.forEach(function(x){if(typeof x.name!=='string'||!Array.isArray(x.units))throw 0;x.g=typeof x.g==='string'?x.g.slice(0,20):'';
   x.units=x.units.map(function(u){return{lec:String(u.lec||''),lecUrl:url(u.lecUrl),hw:String(u.hw||''),hwUrl:url(u.hwUrl),ld:u.ld?1:0,hd:u.hd?1:0,lt:+u.lt||0,ht:+u.ht||0,note:String(u.note||'')}})});
  d.active=0;d.groups=Array.isArray(d.groups)?d.groups.map(String):[];d.gm=1;d.ov=false;d.bk=+d.bk||0;
  S=d;editing=-1;openNote={};armed='';save();msg='已恢复。';return true}
 catch(x){msg='数据格式不对，没有导入。';return false}
}
function reset(){editing=-1;openNote={};armed=''}

document.addEventListener('click',function(e){
 var b=e.target.closest('[data-a]');if(!b)return;
 var a=b.dataset.a,i=+b.dataset.i,c=cur();
 if(a==='tab'){S.active=i;reset();save()}
 else if(a==='ov'){S.ov=true;reset();save();window.scrollTo(0,0)}
 else if(a==='open'){S.ov=false;S.active=i;reset();if(b.dataset.u!=null)goTo=+b.dataset.u;save();if(goTo<0)window.scrollTo(0,0)}
 else if(a==='addc'){addingC=!addingC;focusAdd=addingC}
 else if(a==='mvl'||a==='mvr'){var j=S.courses.indexOf(c),mm=mem(c.g),pp=mm.indexOf(j)+(a==='mvl'?-1:1);if(pp<0||pp>=mm.length)return;var t=mm[pp],sw=S.courses[j];S.courses[j]=S.courses[t];S.courses[t]=sw;S.active=t;armed='';save()}
 else if(a==='grp'){var f=mem(gs()[i])[0];if(f!=null)S.active=f;S.ov=false;reset();save()}
 else if(a==='grn'){var o=c.g,nn=prompt('分组名称',o);nn=nn&&nn.trim().slice(0,20);if(!nn||nn===o)return;var L2=gs().filter(Boolean).map(function(k){return k===o?nn:k});S.courses.forEach(function(x){if(x.g===o)x.g=nn});S.groups=L2.filter(function(k,z){return L2.indexOf(k)===z});save()}
 else if(a==='gml'||a==='gmr'){var L3=gs().filter(Boolean),g3=L3.indexOf(c.g),w=g3+(a==='gml'?-1:1);if(g3<0||w<0||w>=L3.length)return;var tp=L3[g3];L3[g3]=L3[w];L3[w]=tp;S.groups=L3;save()}
 else if(a==='go'){var el=document.getElementById('u'+i);if(el)jump(el,true);return}
 else if(a==='note'){openNote[i]=!openNote[i]}
 else if(a==='ed'){editing=i;armed=''}
 else if(a==='cx'){editing=-1}
 else if(a==='sv'){var r=b.closest('.row'),u=c.units[i],q=function(n){return r.querySelector('[name='+n+']').value.trim()};
  u.lec=q('lec');u.lecUrl=url(q('lu'));u.hw=q('hw');u.hwUrl=url(q('hu'));editing=-1;save()}
 else if(a==='up'||a==='dn'){var k2=i+(a==='up'?-1:1);if(k2<0||k2>=c.units.length)return;
  var r2=b.closest('.row'),cu=c.units[i],q2=function(n){return r2.querySelector('[name='+n+']').value.trim()};
  cu.lec=q2('lec');cu.lecUrl=url(q2('lu'));cu.hw=q2('hw');cu.hwUrl=url(q2('hu'));
  c.units[i]=c.units[k2];c.units[k2]=cu;editing=k2;openNote={};goTo=k2;save()}
 else if(a==='del'){if(armed==='u'+i){c.units.splice(i,1);openNote={};editing=-1;armed='';save()}else{armed='u'+i}}
 else if(a==='delc'){if(armed==='c'){S.courses.splice(S.courses.indexOf(c),1);S.active=0;armed='';save()}else{armed='c'}}
 else if(a==='bulk'){var tx=document.getElementById('bulk').value,cnt=0;
  tx.split(/\r?\n/).forEach(function(line){line=line.trim();if(!line)return;var p=line.split(/\s*[|｜\t]\s*/);var l=p.shift()||'',hw=p.join('；');if(!l&&!hw)return;
   c.units.push({lec:l.slice(0,200),lecUrl:'',hw:hw.slice(0,200),hwUrl:'',ld:0,hd:0,note:''});cnt++});
  if(!cnt)return;openD.bulk=false;save()}
 else if(a==='dl'){
  var bl=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),ou=URL.createObjectURL(bl),an=document.createElement('a');
  an.href=ou;an.download='学习进度-'+dk(Date.now())+'.json';document.body.appendChild(an);an.click();an.remove();
  setTimeout(function(){URL.revokeObjectURL(ou)},2000);S.bk=Date.now();save();msg='备份文件已下载。'}
 else if(a==='imp'){imp(document.getElementById('bk').value)}
 else return;
 R();
});
document.addEventListener('change',function(e){
 var t=e.target;
 if(t.dataset.a==='gsel'){var v=t.value;if(v==='__new'){v=prompt('新分组名称');v=v&&v.trim().slice(0,20);if(!v){R();return}S.groups=gs().filter(Boolean);if(S.groups.indexOf(v)<0)S.groups.push(v)}cur().g=v;save();R();return}
 if(t.dataset.a==='file'){var fi=t.files&&t.files[0];if(!fi)return;var rd=new FileReader();
  rd.onload=function(){imp(String(rd.result));R()};rd.onerror=function(){msg='读取文件失败。';R()};rd.readAsText(fi);return}
 if(t.dataset.a!=='tg')return;
 var u=cur().units[+t.dataset.i],k=t.dataset.k,tk=k==='ld'?'lt':'ht';
 u[k]=t.checked?1:0;u[tk]=t.checked?Date.now():0;save();R();
});
document.addEventListener('input',function(e){
 var t=e.target;if(t.dataset.a==='nt'){cur().units[+t.dataset.i].note=t.value;save();
  var nb=t.closest('.row').querySelector('[data-a=note]');if(nb)nb.textContent=t.value?'笔记 •':'笔记'}
});
document.addEventListener('toggle',function(e){var t=e.target;if(t.dataset&&t.dataset.d)openD[t.dataset.d]=t.open},true);
// 改课程名：只更新标签文字，不整页重绘，避免吞掉紧接着的点击
document.addEventListener('focusout',function(e){
 var t=e.target;if(!(t.dataset&&t.dataset.a==='title'))return;
 var v=t.textContent.trim().slice(0,30);
 if(v){cur().name=v;save();var tb=document.querySelector('.tab.on');if(tb&&tb.firstChild)tb.firstChild.nodeValue=v}
 else t.textContent=cur().name;
});
document.addEventListener('keydown',function(e){
 if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.a==='title'){e.preventDefault();e.target.blur()}
});
document.addEventListener('submit',function(e){
 e.preventDefault();var f=e.target,k=f.dataset.f;
 if(k==='course'){var n=f.n.value.trim();if(!n)return;S.courses.push({name:n.slice(0,30),units:[],g:cur().g});S.active=S.courses.length-1;reset();addingC=false}
 else if(k==='unit'){var l=f.lec.value.trim(),w=f.hw.value.trim();if(!l&&!w)return;cur().units.push({lec:l,lecUrl:'',hw:w,hwUrl:'',ld:0,hd:0,note:''})}
 else return;
 save();R();
});
R();
</script>
</body>
</html>
